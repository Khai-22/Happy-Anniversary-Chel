<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Anniversary Mi Amor Chel</title>

<style>

*{

    margin:0;

    padding:0;

    box-sizing:border-box;

    font-family: 'Georgia', serif;

}

body{

    height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    background:linear-gradient(135deg,#ff758c,#ff7eb3,#ffd1dc);

    overflow:hidden;

}

/* Floating Hearts */

.heart{

    position:absolute;

    color:white;

    animation:float 8s linear infinite;

    opacity:.7;

}

@keyframes float{

    from{

        transform:translateY(100vh) scale(0);

    }

    to{

        transform:translateY(-120vh) scale(1.5);

    }

}

/* Envelope */

.envelope-container{

    position:relative;

    width:320px;

    height:220px;

    cursor:pointer;

    transition:transform .5s;

}

.envelope-container:hover{

    transform:scale(1.05);

}

.envelope{

    position:relative;

    width:100%;

    height:100%;

    background:#f8d7da;

    border-radius:0 0 10px 10px;

}

.flap{

    position:absolute;

    top:0;

    left:0;

    width:0;

    height:0;

    border-left:160px solid transparent;

    border-right:160px solid transparent;

    border-top:120px solid #ff5c8a;

    transform-origin:top;

    transition:transform 1.5s ease;

    z-index:5;

}

.letter{

    position:absolute;

    left:10px;

    top:20px;

    width:300px;

    height:380px;

    background:white;

    border-radius:15px;

    padding:25px;

    text-align:center;

    box-shadow:0 10px 30px rgba(0,0,0,.2);

    transform:translateY(120px);

    opacity:0;

    transition:all 2s ease;

    z-index:1;

}

.open .flap{

    transform:rotateX(180deg);

}

.open .letter{

    transform:translateY(-170px);

    opacity:1;

}

/* Hidden text animation */

.message{

    opacity:0;

    transform:translateY(30px);

}

.show-text .message{

    animation:fadeUp 2s forwards;

}

.show-text .message:nth-child(2){

    animation-delay:.8s;

}

.show-text .message:nth-child(3){

    animation-delay:1.6s;

}

.show-text .message:nth-child(4){

    animation-delay:2.4s;

}

@keyframes fadeUp{

    to{

        opacity:1;

        transform:translateY(0);

    }

}

h1{

    color:#ff3b78;

    margin-bottom:15px;

}

.number{

    color:#d40055;

    font-size:55px;

}

p{

    color:#555;

    font-size:20px;

    margin:12px 0;

}

.roses{

    font-size:45px;

    margin-top:15px;

}

.click-text{

    position:absolute;

    bottom:-45px;

    width:100%;

    text-align:center;

    color:white;

    font-size:18px;

    animation:pulse 1.5s infinite;

}

@keyframes pulse{

    50%{transform:scale(1.1);}

}

</style>

</head>

<body>

<div class="envelope-container" id="envelope">

    <div class="envelope">

        <div class="flap"></div>

        <div class="letter" id="letter">

            <h1 class="message">❤️ Happy Anniversary</h1>

            <h1 class="message"><span class="number">29</span></h1>

            <p class="message">

                Mi Amor Chel 💕

            </p>

            <p class="message">

                Every moment with you is my favorite memory.

            </p>

            <div class="message roses">

                🌹 &nbsp; 🌹

            </div>

        </div>

    </div>

    <div class="click-text">

        💌 Click the envelope to open 💌

    </div>

</div>

<script>

// Open envelope

const envelope = document.getElementById("envelope");

const letter = document.getElementById("letter");

envelope.addEventListener("click", () => {

    envelope.classList.add("open");

    setTimeout(() => {

        letter.classList.add("show-text");

    }, 1500);

});

// Floating hearts

function createHeart(){

    const heart = document.createElement("div");

    heart.classList.add("heart");

    heart.innerHTML = "❤";

    heart.style.left = Math.random()*100 + "vw";

    heart.style.fontSize = (15 + Math.random()*25) + "px";

    heart.style.animationDuration = (5 + Math.random()*5) + "s";

    document.body.appendChild(heart);

    setTimeout(()=>{

        heart.remove();

    },10000);

}

setInterval(createHeart,300);

</script>

</body>

</html>
